<script>
(function () {
  fetch('_data/gallery-cyanotypes-index.json')
    .then(function (res) { return res.json(); })
    .then(function (albums) {
      var grid = document.getElementById('portfolio-grid');
      grid.innerHTML = '';

      if (!albums.length) {
        grid.innerHTML = '<p>No albums yet — check back soon!</p>';
        return;
      }

      albums.forEach(function (album) {
        var card = document.createElement('article');
        card.className = 'album-card';

        var link = document.createElement('a');
        link.href = 'gallery-album.html?album=' + encodeURIComponent(album.slug) + '&section=cyanotypes';
        link.className = 'album-link';

        var thumbDiv = document.createElement('div');
        thumbDiv.className = 'album-thumb';
        var img = document.createElement('img');
        img.src = album.cover || '';
        img.alt = album.title;
        img.loading = 'lazy';
        thumbDiv.appendChild(img);

        var title = document.createElement('h2');
        title.className = 'album-title';
        title.textContent = album.title;

        link.appendChild(thumbDiv);
        link.appendChild(title);
        card.appendChild(link);
        grid.appendChild(card);
      });
    })
    .catch(function () {
      var grid = document.getElementById('portfolio-grid');
      grid.innerHTML = '<p>Could not load albums. Please try again later.</p>';
    });
})();
</script>
