  <!-- Minimal lightbox: only creates UI when an image is clicked -->
  <script>
  (function(){
    const imgs = document.querySelectorAll('.album-gallery img');
    if(!imgs.length) return;

    let backdrop, big, closeBtn;
    function ensureUI(){
      if (backdrop) return;
      backdrop = document.createElement('div');
      backdrop.className = 'lb-backdrop';
      big = document.createElement('img');
      backdrop.appendChild(big);
      closeBtn = document.createElement('button');
      closeBtn.className = 'lb-close';
      closeBtn.setAttribute('aria-label','Close');
      closeBtn.textContent = '×';
      document.body.appendChild(backdrop);
      document.body.appendChild(closeBtn);

      function close(){ backdrop.classList.remove('open'); closeBtn.classList.remove('open'); document.body.style.overflow=''; }
      backdrop.addEventListener('click', close);
      closeBtn.addEventListener('click', close);
      document.addEventListener('keydown', e => { if(e.key==='Escape') close(); });
    }

    imgs.forEach(img=>{
      img.addEventListener('click', ()=>{
        ensureUI();
        big.src = img.src;
        backdrop.classList.add('open');
        closeBtn.classList.add('open');
        document.body.style.overflow = 'hidden';
      });
    });

    // mobile menu toggle
    const btn = document.querySelector('.menu-toggle');
    const list = document.getElementById('site-menu');
    if(btn && list){
      btn.addEventListener('click', ()=>{
        const open = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', String(!open));
        document.querySelector('.site-subnav').setAttribute('aria-expanded', String(!open));
      });
    }
  })();
  </script>
</body>
