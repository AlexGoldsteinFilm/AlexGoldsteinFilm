<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var slug = params.get('album');

  if (!slug) {
    document.getElementById('album-title').textContent = 'Album not found';
    return;
  }

  fetch('_data/albums/' + encodeURIComponent(slug) + '.json')
    .then(function (res) {
      if (!res.ok) throw new Error('Not found');
      return res.json();
    })
    .then(function (album) {
      document.title = album.title + ' — Alex Goldstein Film';
      document.getElementById('album-title').textContent = album.title;
      document.getElementById('album-desc').textContent = album.description || '';

      var gallery = document.getElementById('album-gallery');
      gallery.innerHTML = '';

      if (album.photos && album.photos.length) {
        album.photos.forEach(function (photo) {
          var img = document.createElement('img');
          img.src = typeof photo === 'string' ? photo : photo.image;
          img.alt = album.title;
          img.loading = 'lazy';
          gallery.appendChild(img);
        });
      }

      initDynamicLightbox(gallery);
    })
    .catch(function () {
      document.getElementById('album-title').textContent = 'Album not found';
      document.getElementById('album-desc').textContent = 'Sorry, we couldn\'t find that album.';
    });

  function initDynamicLightbox(gallery) {
    var backdrop, big, closeBtn;

    function ensureUI() {
      if (backdrop) return;
      backdrop = document.createElement('div');
      backdrop.className = 'lb-backdrop';
      big = document.createElement('img');
      backdrop.appendChild(big);
      closeBtn = document.createElement('button');
      closeBtn.className = 'lb-close';
      closeBtn.setAttribute('aria-label', 'Close');
      closeBtn.textContent = '\u00d7';
      document.body.appendChild(backdrop);
      document.body.appendChild(closeBtn);

      function close() {
        backdrop.classList.remove('open');
        closeBtn.classList.remove('open');
        document.body.style.overflow = '';
      }
      backdrop.addEventListener('click', close);
      closeBtn.addEventListener('click', close);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') close();
      });
    }

    gallery.addEventListener('click', function (e) {
      var target = e.target.closest('img');
      if (!target) return;
      ensureUI();
      big.src = target.src;
      backdrop.classList.add('open');
      closeBtn.classList.add('open');
      document.body.style.overflow = 'hidden';
    });
  }
})();
</script>
