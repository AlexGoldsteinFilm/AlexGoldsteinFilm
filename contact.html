<main id="content" class="container contact-container">
  <section class="page-intro"><h1>Let's Create Magic</h1><p>Get in touch to book a session or ask questions.</p></section>
  <section class="contact-form-wrap">
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact" />
      <p class="sr-only"><label>Don't fill this out if you're human: <input name="bot-field" /></label></p>
      <div class="form-field"><label for="name">Your Name</label><input id="name" name="name" type="text" autocomplete="name" required /></div>
      <div class="form-field"><label for="email">Your Email</label><input id="email" name="email" type="email" autocomplete="email" required /></div>
      <div class="form-field"><label for="message">Your Message</label><textarea id="message" name="message" rows="5" required></textarea></div>
      <button type="submit" class="btn">Send Message</button>
      <p class="contact-alt">Prefer email? <a href="mailto:alexgoldsteinfilm@gmail.com">alexgoldsteinfilm@gmail.com</a></p>
    </form>
  </section>
</main>

<script>
  fetch('_data/contact.json')
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.background_photo) {
        document.body.style.backgroundImage =
          'linear-gradient(rgba(238,174,172,.30), rgba(238,174,172,.30)), url(' + d.background_photo + ')';
      }
    })
    .catch(function(){});
</script>
