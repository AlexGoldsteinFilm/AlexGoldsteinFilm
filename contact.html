<!DOCTYPE html><html lang="en"><head><title>Contact — Alex Goldstein Film</title><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkfPWw5qvFjgLG3rGZrjXKjN3rV6V4IVV1iJQGf0S+X7i2GfZ8+8D1gVA=="
      crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="css/styles.css" />
</head><body class="contact-page">
<a class="skip-link" href="#content">Skip to content</a>
<header class="header-titlebar">
  <div class="titlebar-inner">
    <a class="ig-quick" href="https://www.instagram.com/agoldsteinfilm/" target="_blank" rel="noopener" aria-label="Instagram">
      <i class="fa-brands fa-instagram"></i>
    </a>
    <a class="brand" href="index.html">
      <span class="brand__title">Alex Goldstein Film</span>
    </a>
  </div>
</header>
<nav class="site-subnav" aria-label="Primary">
  <button class="menu-toggle" aria-expanded="false" aria-controls="nav-list">
    <span class="sr-only">Toggle navigation</span>
    <i class="fa-solid fa-bars"></i>
  </button>
  <ul id="nav-list" class="nav-list">
    <li><a href="index.html" class="nav-link">Home</a></li>
    <li><a href="about.html" class="nav-link">About</a></li>
    <li><a href="portfolio.html" class="nav-link">Portfolio</a></li>
    <li><a href="services.html" class="nav-link">Services</a></li>
    <li><a href="contact.html" class="nav-link">Contact</a></li>
  </ul>
</nav>

<main id="content" class="container contact-container">
  <section class="page-intro"><h1>Let's Create Magic</h1><p>Get in touch to book a session or ask questions.</p></section>
  <section class="contact-form-wrap">
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact" />
      <p class="sr-only"><label>Don’t fill this out if you're human: <input name="bot-field" /></label></p>
      <div class="form-field"><label for="name">Your Name</label><input id="name" name="name" type="text" autocomplete="name" required /></div>
      <div class="form-field"><label for="email">Your Email</label><input id="email" name="email" type="email" autocomplete="email" required /></div>
      <div class="form-field"><label for="message">Your Message</label><textarea id="message" name="message" rows="5" required></textarea></div>
      <button type="submit" class="btn">Send Message</button>
      <p class="contact-alt">Prefer email? <a href="mailto:alexgoldsteinfilm@gmail.com">alexgoldsteinfilm@gmail.com</a></p>
    </form>
  </section>
</main>
<footer class="site-footer" role="contentinfo">

</footer>

</body></html>
