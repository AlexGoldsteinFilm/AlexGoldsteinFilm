backend:
  name: git-gateway
  branch: main

media_library:
  name: cloudinary
  config:
    cloud_name: dfy80qmy3
    api_key: "381665872177331"

collections:
  - name: albums
    label: Portfolio Albums
    label_singular: Album
    folder: _data/albums
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - label: Photos
        name: photos
        widget: image
        media_library:
          config:
            multiple: true
      - label: Cover Photo
        name: cover
        widget: image
        hint: "Click 'Choose an image' to select one of the photos you already uploaded above."

  - name: settings
    label: Site Settings
    files:
      - name: homepage
        label: Homepage
        file: _data/homepage.json
        fields:
          - { label: Hero Image, name: hero_image, widget: image, hint: "The main photo on the homepage." }