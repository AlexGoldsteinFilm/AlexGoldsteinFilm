backend:
  name: git-gateway
  branch: main

media_library:
  name: cloudinary
  config:
    cloud_name: dfy80qmy3
    api_key: "381665872177331"

collections:
  - name: albums
    label: Portfolio Albums
    label_singular: Album
    folder: _data/albums
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    sort: "date:desc"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: Description, name: description, widget: text }
      - label: Photos
        name: photos
        widget: image
        media_library:
          config:
            multiple: true
      - label: Cover Photo
        name: cover
        widget: image
        hint: "Upload or pick the same image you want as the album cover on the portfolio page."