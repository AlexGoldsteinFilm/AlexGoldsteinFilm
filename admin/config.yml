backend:
  name: git-gateway
  branch: main

media_library:
  name: cloudinary
  config:
    cloud_name: dfy80qmy3
    api_key: "381665872177331"

collections:
  - name: albums
    label: Portfolio Albums
    label_singular: Album
    folder: _data/albums
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - label: Photos
        name: photos
        widget: image
        media_library:
          config:
            multiple: true
      - label: Cover Photo
        name: cover
        widget: image
        hint: "Click 'Choose an image' to select one of the photos you already uploaded above."

  - name: settings
    label: Site Settings
    files:
      - name: homepage
        label: Homepage
        file: _data/homepage.json
        fields:
          - { label: Hero Image, name: hero_image, widget: image, hint: "The main photo on the homepage." }
      - name: about
        label: About Page
        file: _data/about.json
        fields:
          - { label: Photo 1, name: photo1, widget: image, hint: "First about photo — Alex with her camera." }
          - { label: Photo 2, name: photo2, widget: image, hint: "Second about photo — Alex and husband in Colorado." }
          - { label: Photo 3, name: photo3, widget: image, hint: "Third about photo — Alex in the darkroom." }
      - name: services
        label: Services Page
        file: _data/services.json
        fields:
          - { label: Film Photo Shoot Image, name: film_shoot, widget: image, hint: "Photo for the Film Photo Shoot service card." }
          - { label: Darkroom Prints Image, name: darkroom_prints, widget: image, hint: "Photo for the Darkroom Prints service card." }